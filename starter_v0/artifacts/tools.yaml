tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin quan trọng hoặc cần xin xác nhận trước khi thực hiện hành động gửi/ghi dữ liệu. DÙNG KHI: thiếu URL bài viết cụ thể, thiếu tên đối tượng, hoặc cần xin xác nhận yes/no trước khi đăng tin. KHÔNG DÙNG KHI: người dùng đã cung cấp đủ tên người nổi tiếng có thể tự suy luận handle."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi tới người dùng"}
        response_type: 
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "Kiểu trả lời: 'text' khi yêu cầu cung cấp thông tin/link còn thiếu; 'yes_no' khi yêu cầu người dùng xác nhận có muốn gửi/đăng tải hay không."
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn nếu response_type là choice"}
      required: [question]

  - name: timeline
    description: "Lấy danh sách các bài đăng (tweets) gần đây nhất từ dòng thời gian của một người dùng cụ thể trên Twitter/X qua screenname (handle). DÙNG KHI: yêu cầu bài đăng/tweet CỦA một người hoặc tài khoản cụ thể. Tự động quy đổi tên người nổi tiếng sang handle (ví dụ: Sam Altman -> 'sama', Elon Musk -> 'elonmusk', Andrej Karpathy -> 'karpathy'). KHÔNG DÙNG KHI: tìm kiếm bài đăng theo từ khóa, sự kiện hoặc chủ đề thảo luận chung."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle/screenname Twitter không chứa ký tự @ (ví dụ: sama, elonmusk, karpathy)"}
        limit: {type: integer, default: 5, description: "Số lượng bài viết cần lấy (mặc định 5)"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng thảo luận công khai trên mạng xã hội Twitter/X theo từ khóa hoặc chủ đề. DÙNG KHI: tìm xem mọi người/cộng đồng đang nói gì về một chủ đề, sản phẩm, tin tức (ví dụ: GPT-5, OpenAI). KHÔNG DÙNG KHI: lấy bài đăng từ trang cá nhân của một người cụ thể (dùng timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc cụm từ tìm kiếm trên mạng xã hội"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Tiêu chí sắp xếp: 'Latest' cho bài mới nhất; 'Top' cho bài phổ biến, nổi bật nhất"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần tìm"}
      required: [query]

  - name: lookup
    description: "Tra cứu bài báo và tin tức tổng hợp trên internet thông qua công cụ tìm kiếm web. DÙNG KHI: tìm tin tức thời sự, báo chí hoặc tra cứu sự kiện chung. KHÔNG DÙNG KHI: người dùng đã cung cấp đường link cụ thể (phải dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm cốt lõi"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: 'news' cho tin tức báo chí, 'general' cho tra cứu thông thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay/24h qua, 'week' cho tuần này"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả cần trả về lời"}
      required: [query]

  - name: fetch
    description: "Truy cập và đọc nội dung văn bản chi tiết từ một địa chỉ URL trang web cụ thể. DÙNG KHI: yêu cầu tóm tắt, đọc hoặc phân tích nội dung từ một link cụ thể (bắt đầu bằng http:// hoặc https://). KHÔNG DÙNG KHI: chưa có đường dẫn web cụ thể."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Đường dẫn URL hợp lệ cần truy cập"}
      required: [url]

  - name: format
    description: "Định dạng và tổng hợp danh sách các nguồn thông tin đã thu thập được thành văn bản báo cáo có cấu trúc."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các mục tin tức cần trình bày"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu bố cục định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề chính của bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Đăng tải hoặc gửi bản tin/thông điệp ra kênh bên ngoài (Telegram, mạng xã hội). RANH GIỚI BẮT BUỘC: Chỉ được gọi công cụ này khi người dùng ĐÃ XÁC NHẬN ĐỒNG Ý gửi. Nếu người dùng chỉ yêu cầu 'đăng tin' nhưng chưa qua bước xác nhận, TUYỆT ĐỐI KHÔNG gọi tool này mà phải gọi tool clarify với response_type='yes_no' để xin xác nhận trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi"}
        confirmed: {type: boolean, default: false, description: "Trạng thái đã được người dùng xác nhận phê duyệt gửi hay chưa"}
      required: [text]

  - name: policy
    description: "Tra cứu các quy định, hướng dẫn và chính sách vận hành nội bộ của tổ chức. DÙNG KHI: cần kiểm tra quy định về trích dẫn nguồn, an toàn dữ liệu, đạo đức AI."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung quy định cần tra cứu"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cụ thể"}
        top_k: {type: integer, default: 3, description: "Số lượng quy định liên quan cần lấy"}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo khoa học và công trình nghiên cứu học thuật trên arXiv theo chủ đề kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa học thuật"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí xếp hạng bài báo"}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất toàn bộ nội dung văn bản thô từ một bài báo arXiv thông qua URL hoặc ID."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc URL của bài báo arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất"}
        max_chars: {type: integer, default: 8000, description: "Số lượng ký tự tối đa"}
      required: [arxiv_url]